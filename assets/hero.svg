<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Muhamad Fauzan Pratama, Junior Game Developer and Web Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.45" stop-color="#14307a"/>
      <stop offset="0.8" stop-color="#2f8ee8"/>
      <stop offset="1" stop-color="#bfe6fb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <g id="cloud">
      <ellipse cx="70" cy="34" rx="68" ry="20"/>
      <ellipse cx="38" cy="26" rx="32" ry="20"/>
      <ellipse cx="96" cy="22" rx="36" ry="22"/>
    </g>
    <path id="flight" d="M30 312 C300 304 600 284 760 192 S930 72 975 40"/>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .c1 { animation: drift 48s linear infinite; }
    .c2 { animation: drift 70s linear infinite; animation-delay: -30s; }
    .c3 { animation: drift 58s linear infinite; animation-delay: -12s; }
    .fade { animation: rise 1.4s ease-out both; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1100px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .star, .c1, .c2, .c3, .fade { animation: none; }
    }
  </style>

  <!-- sky -->
  <rect width="1000" height="340" fill="url(#sky)"/>
  <rect width="1000" height="230" fill="url(#grid)"/>
  <text x="780" y="190" font-size="170" fill="#ffffff" fill-opacity="0.06" class="mono" font-weight="700">&lt;/&gt;</text>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="star" cx="70" cy="30" r="1.6"/>
    <circle class="star" cx="170" cy="62" r="1.2" style="animation-delay:.6s"/>
    <circle class="star" cx="290" cy="22" r="1.8" style="animation-delay:1.2s"/>
    <circle class="star" cx="410" cy="48" r="1.2" style="animation-delay:1.8s"/>
    <circle class="star" cx="530" cy="26" r="1.6" style="animation-delay:.3s"/>
    <circle class="star" cx="640" cy="60" r="1.2" style="animation-delay:2.1s"/>
    <circle class="star" cx="720" cy="20" r="1.8" style="animation-delay:.9s"/>
    <circle class="star" cx="850" cy="52" r="1.4" style="animation-delay:1.5s"/>
    <circle class="star" cx="930" cy="24" r="1.6" style="animation-delay:2.4s"/>
    <circle class="star" cx="610" cy="110" r="1" style="animation-delay:.2s"/>
    <circle class="star" cx="940" cy="120" r="1.2" style="animation-delay:1.1s"/>
  </g>

  <!-- flight path + paper plane -->
  <use xlink:href="#flight" href="#flight" fill="none" stroke="#e0f2fe" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="3 7"/>
  <polygon points="-9,-6 11,0 -9,6 -5,0" fill="#ffffff">
    <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
      <mpath xlink:href="#flight" href="#flight"/>
    </animateMotion>
  </polygon>

  <!-- text -->
  <g class="fade">
    <text x="60" y="78" font-size="15" fill="#7dd3fc" class="mono">// look up · lock in · level up</text>
    <text x="60" y="140" font-size="44" font-weight="800" fill="#ffffff" class="sans" letter-spacing="1">MUHAMAD FAUZAN PRATAMA</text>
    <text x="60" y="180" font-size="21" fill="#bae6fd" class="sans">Junior Game Developer · Web Developer</text>
    <text x="60" y="214" font-size="14" fill="#7dd3fc" class="mono">const mindset = ['curious', 'focused', 'moving forward'];</text>
    <rect x="60" y="226" width="300" height="2" fill="url(#glow)"/>
  </g>

  <!-- clouds -->
  <g fill="#ffffff" fill-opacity="0.88">
    <g class="c1"><use xlink:href="#cloud" href="#cloud" x="0" y="262"/></g>
    <g class="c2"><use xlink:href="#cloud" href="#cloud" x="0" y="210" transform="scale(1.3)"/></g>
    <g class="c3" fill-opacity="0.6"><use xlink:href="#cloud" href="#cloud" x="0" y="300" transform="scale(0.8)"/></g>
  </g>
</svg>
